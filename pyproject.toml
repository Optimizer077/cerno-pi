[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerno-pi"
version = "0.1.0"
description = "Cerno decision models (typed questions, calibrated probabilities) on pinfer, the Raspberry Pi 4 engine"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pinfer>=0.2.0", "numpy"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cerno-pi = "cerno_pi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cerno_pi"]

[tool.ruff]
line-length = 100
